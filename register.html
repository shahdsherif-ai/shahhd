<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">

</head>
<body style="background-color:#ffffff; ">



    <header class="header-register mt-4">
<div class="container">
    <div class="row">
        <div class="md:col-6">
            <img src="56f58c5bbae6320e1aa5d36445fd722b.jpg" class="w-75">
        </div>

        <div class="md:col-6">
            <h2 class="fg-black">Create Account</h2>
            <h4  class="mt-4 mb-7 fg-black">Go ahead and sign up, let everyone<br>know how awesome you are!</h4>
            <h4 id="result"class="alert theme-danger text-center d-block" ></h4>
            <form onsubmit=" return validateVaule()" action="success.html" method="post">
                <input id="user" type="text" placeholder="User Name" name="user" class="fg-black form-control mb-7 bg-white p-4">

                <input id="email" type="text" placeholder="Email" name="email" class="fg-black form-control mb-7 bg-white p-4">

                <input id="pass" type="password" placeholder="Password" name="pass" class="fg-black form-control mb-7 bg-white p-4">

                <input id="confirm" type="password" placeholder="Confirm Password" name="confirm" class="fg-black form-control mb-7 bg-white p-4">

                <input type="submit" value="Create New Account" class="btn-solid theme-primary d-block w-100">
            </form>
        </div>
    </div>
</div>
 </div>
    </header>
<script src="java/bootstrap.bundle.min.js"></script>
<script src="java/main.js"></script>
</body>
</html>
